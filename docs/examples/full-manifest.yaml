# Reference manifest covering every field in ARCHITECTURE.md Appendix A.
# Used as the schema-parser fixture for parseManifest() acceptance tests.
#
# NOT a runnable config. This file is a schema-coverage example that
# exercises every supported field, including install-specific hook
# script paths under ~/.claude/hooks/. Running
#   harness validate --config docs/examples/full-manifest.yaml
# on an arbitrary machine WILL report a handful of "path does not exist"
# errors for those hook scripts (and a few warnings for binaries that
# only exist in a real install, e.g. git-batch, ledger). That is
# expected: validate is doing its job, the manifest is doing its job,
# the assets just only exist on a wired-up host. To explore policy
# matching against this manifest without touching disk, use
#   harness dry-run "<intent>" --tool <tool> --config docs/examples/full-manifest.yaml
# (see README "Try it yourself"). Run `harness init --template full`
# for a manifest tailored to your machine.
version: 1

grounding:
  session:
    auto_start: true
    id_format: "gs-{repo}-{rand:8}"
  evidence_ledger:
    path: ~/.evidence-ledger/ledger.db
    retention_days: 90
  policies_source: ~/.claude/harness.d/policies/claim-gate.yaml

tools:
  mcp:
    - name: codebase-oracle
      command: [npx, tsx, ~/git/pandora/codebase-oracle/src/mcp-server.ts]
      health:
        verb: oracle_list_repos
        timeout_ms: 5000
      enabled: true
    - name: agent-tasks
      command: [node, ~/git/pandora/agent-tasks/mcp-server/dist/server.js]
      env:
        AGENT_TASKS_URL: https://agent-tasks.opentriologue.ai
      health:
        verb: projects_list
        timeout_ms: 5000
      enabled: true
    - name: grounding-mcp
      command: [node, ~/git/pandora/agent-grounding/packages/grounding-mcp/dist/server.js]
      # No env block on purpose: grounding-mcp resolves EVIDENCE_LEDGER_DB via
      # os.homedir(). A literal `~` here is not expanded and scatters a rogue
      # ./~/.evidence-ledger/ledger.db relative to cwd (v0.10.0 template fix).
      health:
        verb: ledger_status
        timeout_ms: 5000
      enabled: true

  cli:
    - name: git-batch
      binary: git-batch
      min_version: "0.2.0"
      required: true
    - name: gh
      binary: gh
      required: true
    - name: ledger
      binary: ledger
      required: false

  skills:
    enabled:
      - simplify
      - init
      - review
      - security-review
    source_dirs:
      - ~/.claude/skills

  builtin:
    known: [Read, Edit, Write, Bash, Agent, Skill, TaskCreate]

memory:
  directories:
    - path: ~/.claude/projects/{project}/memory
      scope: project
  router:
    command: [node, ~/git/pandora/agent-memory/packages/memory-router/dist/hooks/user-prompt-submit.js]
    enabled: true
  retention:
    staleness_days: 180
    broken_refs: warn
  scopes:
    default: project
    allowed: [project, user]

hooks:
  - name: git-preflight
    event: SessionStart
    command: ~/.claude/hooks/git-preflight.sh
    blocking: false
    # 70s budget covers a healthy preflight on medium-size repos
    # (default subprocess timeout is 60s in the bundled wrapper since
    # agent-tasks/7265599e); leave 10s headroom for ledger write.
    budget_ms: 70000
    # Floor at agent-preflight 0.2.0, the release that makes secret
    # detection git-aware and diff-scoped. Pre-0.2.0 installs hard-fail
    # preflight on the normal correct state (a gitignored .env holding
    # real credentials), so this SessionStart producer never writes a
    # preflight: tag and the preflight-before-* policies stay closed
    # forever on any repo with a local .env.
    min_version: "0.2.0"
    version_command: ["preflight", "--version"]
    description: "Run agent-preflight on session start; record ready + confidence into the ledger as preflight:${REPO}."

  - name: require-review-evidence
    event: PreToolUse
    match: "mcp__agent-tasks__pull_requests_merge"
    command: ~/.claude/hooks/require-review-evidence.sh
    blocking: hard
    budget_ms: 2000

  # Tool-agnostic parallel for operators on the gh-cli workflow
  # (`gh pr merge`) instead of agent-tasks MCP. A PolicyTrigger can only
  # AND-match one surface (MCP tool-name OR Bash command), so two parallel
  # definitions are the minimum-scope way to cover both PR surfaces.
  - name: require-review-evidence-bash
    event: PreToolUse
    match: "Bash"
    bash_match: '(^|\n|;|\||&|\()\s*(\w+=\S+\s+)*gh pr merge\b'
    command: ~/.claude/hooks/require-review-evidence.sh
    blocking: hard
    budget_ms: 2000

  # The two OTHER agent-tasks verbs that land a PR: `task_merge` merges the
  # PR attached to a task, `task_finish` with `autoMerge: true` merges as
  # part of finishing. Each needs its own hook entry because a hook's
  # `match` is the settings.json tool-name matcher `harness apply` projects.
  - name: require-review-evidence-task-merge
    event: PreToolUse
    match: "mcp__agent-tasks__task_merge"
    command: ~/.claude/hooks/require-review-evidence.sh
    blocking: hard
    budget_ms: 2000

  - name: require-review-evidence-task-finish
    event: PreToolUse
    match: "mcp__agent-tasks__task_finish"
    command: ~/.claude/hooks/require-review-evidence.sh
    blocking: hard
    budget_ms: 2000

  - name: require-dogfood-evidence
    event: PreToolUse
    match: "Bash"
    command: ~/.claude/hooks/require-dogfood-evidence.sh
    blocking: hard
    budget_ms: 2000

  - name: require-preflight-evidence
    event: PreToolUse
    match: "Bash"
    bash_match: '(^|\n|;|\||&|\()\s*(\w+=\S+\s+)*git( -C \S+)* (status|log|diff|branch)\b'
    command: ~/.claude/hooks/require-preflight-evidence.sh
    blocking: hard
    budget_ms: 1000

  - name: require-review-subagent-evidence
    event: PreToolUse
    match: "mcp__agent-tasks__pull_requests_create"
    command: ~/.claude/hooks/require-review-subagent-evidence.sh
    blocking: hard
    budget_ms: 2000

  # Bash-surface parallel for operators who open PRs with `gh pr create`
  # instead of agent-tasks MCP. Tags by BRANCH because no task UUID is in
  # the `gh pr create` arguments.
  - name: require-review-subagent-evidence-bash
    event: PreToolUse
    match: "Bash"
    bash_match: '(^|\n|;|\||&|\()\s*(\w+=\S+\s+)*gh pr create\b'
    command: ~/.claude/hooks/require-review-subagent-evidence.sh
    blocking: hard
    budget_ms: 2000

  - name: require-preflight-push-evidence
    event: PreToolUse
    match: "Bash"
    bash_match: '(^|\n|;|\||&|\()\s*(\w+=\S+\s+)*git( -C \S+)* push\b'
    command: ~/.claude/hooks/require-preflight-push-evidence.sh
    blocking: hard
    budget_ms: 1000

  # deny-kill-switch-bash / deny-session-env-strip-bash / deny-sentinel-write-bash
  # (task cf1fde6d): `harness pause`/`harness resume` refuse to run inside an
  # agent shell in CODE, but that CLI check is a speed bump, not a boundary: a
  # Claude Code `! `-prefixed shell inherits this session's env AND its non-TTY
  # stdin, so it is indistinguishable from an agent Bash call and trips the
  # same check the agent would trip (verified live; see
  # docs/okf/pause-vs-gate-kill-switch.md). The actual enforcement point that
  # runs BEFORE the agent's Bash executes is this PreToolUse deny-policy layer.
  - name: deny-kill-switch-bash
    event: PreToolUse
    match: "Bash"
    bash_match: '(^|\n|;|\||&|\()\s*(\w+=\S*\s+)*(?:npx\s+|\S*/)?harness\s+(["\x27]?)(?:pause|resume|gate\s+(["\x27]?)(?:disable|enable)\4)\3(?![\w-])'
    command: ~/.claude/hooks/deny-kill-switch.sh
    blocking: hard
    budget_ms: 1000

  - name: deny-session-env-strip-bash
    event: PreToolUse
    match: "Bash"
    bash_match: '(^|\n|;|\||&|\()\s*(\w+=\S*\s+)*(env\b[^;\n|&]*-u\s*(CLAUDE_CODE_SESSION_ID|CLAUDE_SESSION_ID|CODEX_SESSION_ID)\b|env\b[^;\n|&]*--unset(?:=|\s+)(CLAUDE_CODE_SESSION_ID|CLAUDE_SESSION_ID|CODEX_SESSION_ID)\b|unset\s+(\S+\s+)*(CLAUDE_CODE_SESSION_ID|CLAUDE_SESSION_ID|CODEX_SESSION_ID)\b|(CLAUDE_CODE_SESSION_ID|CLAUDE_SESSION_ID|CODEX_SESSION_ID)=(?=\s))'
    command: ~/.claude/hooks/deny-session-env-strip.sh
    blocking: hard
    budget_ms: 1000

  # Known gap, deliberately not faked as coverage: this only catches the
  # obvious shell shapes (`> .harness-paused`, `tee .harness-paused`,
  # `cp ... .harness-paused`). A regex over the raw command string cannot
  # see through a heredoc, `sh -c '...'`, `bash -lc`, `eval`, `python -c`,
  # base64-decoded payloads, an fs.write call inside a script file the agent
  # creates and then executes, a symlink swap, or the sentinel-write
  # equivalents of `cp`/`>` done via `mv`, `ln`, `install`, or `dd`. These
  # are NOT covered on purpose (regex whack-a-mole against every file-write-
  # capable tool does not meaningfully close this class); closing it for
  # real needs either signing the sentinel (HMAC) or a filesystem-level
  # write guard, neither in scope here; both are noted as follow-ups.
  - name: deny-sentinel-write-bash
    event: PreToolUse
    match: "Bash"
    bash_match: '(^|\n|;|\||&|\()\s*(\w+=\S*\s+)*(tee|cp)\b[^;\n|&]*\.harness-paused\b|>{1,2}\s*\S*\.harness-paused\b'
    command: ~/.claude/hooks/deny-sentinel-write.sh
    blocking: hard
    budget_ms: 1000

  # risk-gate (Phase 7 #6): the Risk Gate enforcement hook for the
  # gate-prod-destructive policies. Uses the `harness policy intercept`
  # entrypoint directly — the interceptor classifies risk and resolves
  # the environment before evaluating the policies' `when:` clauses.
  # budget_ms 15000 (task 7bf47554): the generic `harness policy intercept`
  # engine's own ledger query + deny-degraded audit-retry can take up to
  # ~10.8-13.75s against the default grounding-mcp health.timeout_ms=5000;
  # a lower Claude Code outer timeout risks killing the subprocess before
  # its deny JSON reaches stdout, which Claude Code then treats as allow.
  # See src/cli/init/templates.ts's identical `risk-gate` hook for the full
  # rationale (this is the only hook in this schema-coverage fixture that
  # actually routes through `harness policy intercept`; the other hooks
  # above are illustrative external `~/.claude/hooks/*.sh` scripts, out of
  # this task's scope).
  - name: risk-gate
    event: PreToolUse
    match: "Bash"
    command: harness policy intercept
    blocking: hard
    budget_ms: 15000

policies:
  - name: review-before-merge
    description: Block PR merges unless a ledger entry tagged review:<pr-number> exists for this session.
    trigger:
      event: PreToolUse
      match: "mcp__agent-tasks__pull_requests_merge"
      extract:
        PR_NUMBER: "toolArgs.prNumber"
    requires:
      ledger_tag: "review:${PR_NUMBER}"
    hook: require-review-evidence
    enforcement: block
    producers:
      - kind: mcp
        verb: mcp__grounding-mcp__ledger_add
        example: '{sessionId:"${SESSION_ID}", type:"fact", content:"review:${PR_NUMBER} — <verdict + key findings + nits>", source:"Agent(general-purpose) review"}'
        description: Spawn a review subagent against the PR diff, capture its verdict, then persist a ledger entry tagged with the PR number. The content should be self-contained enough for an auditor to read without re-opening the chat.
    ux:
      cannot: "You cannot merge PR #${PR_NUMBER} yet."
      required:
        - "a recorded review of PR #${PR_NUMBER}"
      run:
        - 'harness record review --pr ${PR_NUMBER} "<summary>"'

  # Bash-surface parallel of review-before-merge for operators on the gh-cli
  # workflow. Tag shape is `review:${BRANCH}` instead of `review:${PR_NUMBER}`
  # because PR_NUMBER is not extractable from `tool_input.command` with the
  # JSONPath-only extract DSL; BRANCH is the stable identifier the producer
  # can record at review time. Sits ALONGSIDE review-before-merge, not as a
  # replacement: an operator using both surfaces gets both gates, each with
  # its own tag shape.
  - name: review-before-merge-bash
    description: Block `gh pr merge` unless a ledger entry tagged review:<branch> exists for this session.
    trigger:
      event: PreToolUse
      match: "Bash"
      bash_match: '(^|\n|;|\||&|\()\s*(\w+=\S+\s+)*gh pr merge\b'
    requires:
      ledger_tag: "review:${BRANCH}"
    hook: require-review-evidence-bash
    enforcement: block
    producers:
      - kind: mcp
        verb: mcp__grounding-mcp__ledger_add
        example: '{sessionId:"${SESSION_ID}", type:"fact", content:"review:${BRANCH} — <verdict + key findings + nits>", source:"Agent(general-purpose) review"}'
        description: Spawn a review subagent against the branch diff, capture its verdict, then persist a ledger entry tagged with the branch name. Mirror of the review-before-merge producer for the gh-cli surface.
    ux:
      cannot: "You cannot merge the PR for branch ${BRANCH} via `gh pr merge` yet."
      required:
        - "a recorded review of the PR for branch ${BRANCH}"
      run:
        - 'harness record review --pr <pr> "<summary>"'

  # Task-scoped merge surfaces. Tag shape is `review:${TASK_ID}`: both verbs
  # derive owner/repo/PR number from the task, so `taskId` is the only
  # identifier in the tool payload. `harness record review --pr <pr> --task
  # <id> "<summary>"` writes the PR, branch, base and task tags in ONE ledger
  # fact, so a single recorded review satisfies all four merge gates.
  # task_finish is gated ONLY in its auto-merge mode: `input_match` narrows
  # the trigger to the mode that actually merges, so a plain `task_finish`
  # (which merges nothing) passes untouched. A missing `autoMerge` never
  # matches an `input_match` entry.
  - name: review-before-task-merge
    description: Block agent-tasks task_merge unless a ledger entry tagged review:<task-id> exists for this session.
    trigger:
      event: PreToolUse
      match: "mcp__agent-tasks__task_merge"
      extract:
        TASK_ID: "toolArgs.taskId"
    requires:
      ledger_tag: "review:${TASK_ID}"
    hook: require-review-evidence-task-merge
    enforcement: block
    producers:
      - kind: mcp
        verb: mcp__grounding-mcp__ledger_add
        example: '{sessionId:"${SESSION_ID}", type:"fact", content:"review:${TASK_ID}: <verdict + key findings + nits>", source:"Agent(general-purpose) review"}'
        description: Spawn a review subagent against the PR diff, capture its verdict, then persist a ledger entry tagged with the task id. Mirror of the review-before-merge producer for the task-scoped merge surface.
    ux:
      cannot: "You cannot merge the PR for task ${TASK_ID} yet."
      required:
        - "a recorded review of task ${TASK_ID}"
      run:
        - 'harness record review --pr <pr> --task ${TASK_ID} "<summary>"'

  - name: review-before-task-finish-automerge
    description: 'Block agent-tasks task_finish with autoMerge: true unless a ledger entry tagged review:<task-id> exists for this session.'
    trigger:
      event: PreToolUse
      match: "mcp__agent-tasks__task_finish"
      input_match:
        toolArgs.autoMerge: true
      extract:
        TASK_ID: "toolArgs.taskId"
    requires:
      ledger_tag: "review:${TASK_ID}"
    hook: require-review-evidence-task-finish
    enforcement: block
    producers:
      - kind: mcp
        verb: mcp__grounding-mcp__ledger_add
        example: '{sessionId:"${SESSION_ID}", type:"fact", content:"review:${TASK_ID}: <verdict + key findings + nits>", source:"Agent(general-purpose) review"}'
        description: Spawn a review subagent against the PR diff, capture its verdict, then persist a ledger entry tagged with the task id. Same evidence the task_merge gate reads, so one recorded review opens both.
    ux:
      cannot: "You cannot finish task ${TASK_ID} with autoMerge yet."
      required:
        - "a recorded review of task ${TASK_ID}"
      run:
        - 'harness record review --pr <pr> --task ${TASK_ID} "<summary>"'

  - name: dogfood-before-release
    description: Block npm publish / git tag v* without a recent dogfood ledger entry.
    trigger:
      event: PreToolUse
      match: "Bash"
      bash_match: '(^|\n|;|\||&|\()\s*(\w+=\S+\s+)*(npm publish\b|git( -C \S+)* tag v)'
    requires:
      ledger_tag: "dogfood:${SESSION_ID}"
      within: 24h
    hook: require-dogfood-evidence
    enforcement: block
    producers:
      - kind: mcp
        verb: mcp__grounding-mcp__ledger_add
        example: '{sessionId:"${SESSION_ID}", type:"fact", content:"dogfood:${SESSION_ID} — <end-to-end smoke summary against the live system>", source:"manual smoke test"}'
        description: Before tagging or publishing, run the release path end-to-end against the live system (not just unit tests) and persist the result as a session-tagged ledger entry. Document what you exercised (install, CLI happy path, MCP handshake, etc.) so a future auditor can tell whether the smoke covered the change.
    ux:
      cannot: "You cannot publish a release yet."
      required:
        - "an end-to-end dogfood run in this session"
      run:
        - 'harness record dogfood "<was wurde real ausprobiert>"'

  - name: two-reviewers-required
    description: At least two distinct reviewer ledger entries must exist for the PR.
    trigger:
      event: PreToolUse
      match: "mcp__agent-tasks__pull_requests_merge"
      extract:
        PR_NUMBER: "toolArgs.prNumber"
    requires:
      ledger_tag: "review:${PR_NUMBER}"
      count:
        min: 2
    hook: require-review-evidence
    enforcement: warn
    producers:
      - kind: mcp
        verb: mcp__grounding-mcp__ledger_add
        example: '{sessionId:"${SESSION_ID}", type:"fact", content:"review:${PR_NUMBER} — <verdict + key findings + nits>", source:"Agent(general-purpose) review (reviewer 2)"}'
        description: Same shape as review-before-merge but TWO DISTINCT reviewer entries must exist before the gate is satisfied (count.min 2). Distinguish reviewers by source so the count is honest. Warn-level enforcement, so the agent CAN merge with one reviewer but should consider spawning a second for load-bearing changes.

  - name: preflight-before-investigation
    description: Block investigative git reads when agent-preflight has not run recently with ready:true for the current repo (founding-incident policy).
    trigger:
      event: PreToolUse
      match: "Bash"
      bash_match: '(^|\n|;|\||&|\()\s*(\w+=\S+\s+)*git( -C \S+)* (status|log|diff|branch)\b'
    requires:
      ledger_tag: "preflight:${REPO}"
      within: 1h
    hook: require-preflight-evidence
    enforcement: block
    producers:
      - kind: bash
        command: harness session-start preflight
        description: Runs agent-preflight against the current cwd; on ready:true, records preflight:${REPO} to the ledger. Standard producer.
      - kind: mcp
        verb: mcp__grounding-mcp__ledger_add
        example: '{sessionId:"${SESSION_ID}", type:"fact", content:"preflight:${REPO}", source:"manual"}'
        description: Direct ledger write. Use when the Bash hook is locked down (e.g. understanding-gate active) or when the standard producer is unavailable.
    ux:
      cannot: "You cannot investigate this repository yet."
      required:
        - "verified repository preflight"
        - "an approved Understanding Report, if the Understanding Gate is still active (it blocks `harness preflight` itself)"
      run:
        - "harness preflight"

  - name: review-subagent-before-pr-create
    description: Block agent-tasks PR creation unless a review-subagent ledger entry tagged for this task already exists. Forces the rigorous review BEFORE the PR opens, not after.
    trigger:
      event: PreToolUse
      match: "mcp__agent-tasks__pull_requests_create"
      extract:
        TASK_ID: "toolArgs.taskId"
    requires:
      ledger_tag: "review-subagent:${TASK_ID}"
    hook: require-review-subagent-evidence
    enforcement: block
    producers:
      - kind: mcp
        verb: mcp__grounding-mcp__ledger_add
        example: '{sessionId:"${SESSION_ID}", type:"fact", content:"review-subagent:${TASK_ID} — <verdict + key findings + nits>", source:"Agent(general-purpose) review"}'
        description: After running a review subagent against the staged diff, persist its verdict + load-bearing findings as a ledger entry tagged with the task UUID. The content should be self-contained enough to audit later without re-reading the chat.
    ux:
      cannot: "You cannot open a pull request for task ${TASK_ID} yet."
      required:
        - "a completed review-subagent pass on this task"
      run:
        - 'harness record review-subagent --task ${TASK_ID} --verdict <verdict>'

  # Bash-surface parallel of review-subagent-before-pr-create. Tag shape is
  # `review-subagent:${BRANCH}` because TASK_ID is an agent-tasks-only concept;
  # for the gh-cli workflow the working branch is the closest stable handle
  # for "the PR-in-progress" at this point in the cycle.
  - name: review-subagent-before-pr-create-bash
    description: Block `gh pr create` unless a review-subagent ledger entry tagged review-subagent:<branch> exists for this session. Forces the rigorous review BEFORE the PR opens.
    trigger:
      event: PreToolUse
      match: "Bash"
      bash_match: '(^|\n|;|\||&|\()\s*(\w+=\S+\s+)*gh pr create\b'
    requires:
      ledger_tag: "review-subagent:${BRANCH}"
    hook: require-review-subagent-evidence-bash
    enforcement: block
    producers:
      - kind: mcp
        verb: mcp__grounding-mcp__ledger_add
        example: '{sessionId:"${SESSION_ID}", type:"fact", content:"review-subagent:${BRANCH} — <verdict + key findings + nits>", source:"Agent(general-purpose) review"}'
        description: After running a review subagent against the staged diff for the working branch, persist its verdict + load-bearing findings as a ledger entry tagged with the branch name. Mirror of the review-subagent-before-pr-create producer for the gh-cli surface.
    ux:
      cannot: "You cannot open a pull request for branch ${BRANCH} via `gh pr create` yet."
      required:
        - "a completed review-subagent pass on branch ${BRANCH}"
      run:
        - 'harness record review-subagent --task <task-id> --verdict <verdict>'

  - name: preflight-before-push
    description: Block git push unless a fresh preflight ledger entry exists for the current branch. Catches the stale-checkout class of incident at the last reversible step.
    trigger:
      event: PreToolUse
      match: "Bash"
      bash_match: '(^|\n|;|\||&|\()\s*(\w+=\S+\s+)*git( -C \S+)* push\b'
    requires:
      ledger_tag: "preflight:${BRANCH}"
      within: 10m
      # at_head:true lets a preflight at the current HEAD satisfy the
      # gate at any age (the standard producer writes head:<sha> into
      # the tag content). The 10m window remains the freshness ceiling
      # for the head-mismatch case (operator switched branch, preflight
      # predates HEAD shift, runtime couldn't resolve a sha).
      at_head: true
    hook: require-preflight-push-evidence
    enforcement: block
    producers:
      - kind: bash
        command: harness session-start preflight
        description: Runs agent-preflight against the current cwd; on ready:true, records preflight:${BRANCH} ready:true confidence:<n> head:<sha> to the ledger. Standard producer.
      - kind: mcp
        verb: mcp__grounding-mcp__ledger_add
        example: '{sessionId:"${SESSION_ID}", type:"fact", content:"preflight:${BRANCH} head:<full-sha> — <summary of what is on the branch + smoke results>", source:"manual"}'
        description: Direct ledger write. Include head:<full-sha> if you want the entry to count under at_head; the branch is the WIP review surface and the content should summarise what is staged + the smoke evidence so a reviewer can audit later without re-reading the chat.
    ux:
      cannot: "You cannot push branch ${BRANCH} yet."
      required:
        - "a preflight for ${BRANCH} at the current HEAD (any age) OR any preflight within the last 10 minutes. Re-run `harness preflight` if you committed since the last preflight AND it has been more than 10 minutes."
        - "if solution-acceptance is enabled, a ready HEAD-pinned verdict at the SAME commit too (run `solution_evaluate`). `git push` trips both gates, so commit first if the tree is dirty, then satisfy both at one HEAD."
        - "an approved Understanding Report, if the Understanding Gate is still active (it blocks `harness preflight` itself)"
      run:
        - "harness preflight"

  # Phase 7 Risk Gate — the canonical built-in worked example. These two
  # policies, with the dangerous-shell classifier and production-signals
  # resolver below, are the Risk Gate's default stance: a destructive
  # shell action whose target environment resolves to production is
  # gated before the runtime fires it. Both fire ONLY when the
  # environment resolves to production (a main / release branch, a
  # prod-looking DATABASE_URL, or a prod kube context); on an ordinary
  # feature branch the environment is unknown and neither fires. Ordered
  # deny-first so a critical action (which also matches the high
  # threshold) gets the hard-deny envelope.
  - name: gate-prod-destructive
    description: Deny critical-severity destructive shell actions against a production target.
    trigger:
      event: PreToolUse
      match: "Bash"
    when:
      risk.severity_at_least: critical
      environment.name: production
    requires:
      ledger_tag: "risk-override:${SESSION_ID}"
    hook: risk-gate
    enforcement: block
    # Operator-in-the-loop gate: the override tag is written by the
    # operator verb (ask semantics), not by the agent. The mcp producer is
    # the schema-required ungated recovery documentation; the enforcing
    # path is the ask producer. See writing-custom-policies.md, tripwire 4.
    producers:
      - kind: ask
        command: harness approve risk --force <reason>
        description: Deliberate operator override for a critical production mutation; run from the operator shell.
      - kind: mcp
        verb: mcp__grounding-mcp__ledger_add
        example: '{sessionId:"${SESSION_ID}", type:"fact", content:"risk-override:${SESSION_ID} — operator-authorized <reason>", source:"operator"}'
        description: Recovery path if the approve verb is unavailable; only meaningful when the OPERATOR authorizes the content.
    ux:
      cannot: "You cannot run this critical destructive action against production."
      required:
        - "a deliberate operator override: a critical production mutation has no benign reading"
      run:
        - "Choose a non-destructive alternative, or ask the OPERATOR to run the command themselves, outside the agent."
        - "Operator override (deliberate): the OPERATOR runs `harness approve risk --force <reason>` from their own shell (`! ` prefix in Claude Code, with --i-am-the-operator to acknowledge a non-TTY invocation)."
  - name: gate-prod-destructive-approval
    description: Require operator approval for high-severity destructive shell actions against a production target.
    trigger:
      event: PreToolUse
      match: "Bash"
    when:
      risk.severity_at_least: high
      environment.name: production
    requires:
      ledger_tag: "risk-approved:${SESSION_ID}"
    hook: risk-gate
    enforcement: require_approval
    producers:
      - kind: ask
        command: harness approve risk
        description: Operator approves this Risk Gate decision from their own shell.
      - kind: mcp
        verb: mcp__grounding-mcp__ledger_add
        example: '{sessionId:"${SESSION_ID}", type:"fact", content:"risk-approved:${SESSION_ID} — operator-authorized", source:"operator"}'
        description: Recovery path if the approve verb is unavailable; only meaningful when the OPERATOR authorizes the content.
    ux:
      cannot: "You cannot run this destructive production action yet."
      required:
        - "operator approval of this Risk Gate decision"
      run:
        - "harness approve risk"

  # gate-dev-unsafe-deletion (task d03af8f6): the two policies above fire
  # ONLY when the environment resolves to production — on an ordinary
  # task branch (environment: unknown) a deletion command runs
  # unconfirmed even when its target is a stray variable or a relative
  # path pointing somewhere unintended. This policy is deliberately
  # environment-INDEPENDENT (no environment.name clause) and gates on the
  # new `action.deletion_target_unresolvable` clause instead of
  # `risk.severity_at_least`/`risk.category_in` specifically because
  # those fail-close to matched=true for ANY unclassified action —
  # unscoped, that would gate every unrelated unclassified Bash call in
  # every environment. `action.deletion_target_unresolvable` only fires
  # for a recognized deletion verb (`rm -r*`/`-f*`, `find ... -delete`,
  # `git clean -f*`) whose target(s) cannot be statically proven inside
  # `risk.safe_deletion_roots` (below). See docs/risk-gate.md.
  #
  # This policy consults its OWN ledger tag
  # (`risk-approved:deletion:${SESSION_ID}`), never the tag
  # `gate-prod-destructive-approval` above consults — a routine dev-
  # context deletion approval must not also clear the production
  # approval gate. `harness approve risk --scope deletion` writes this
  # tag; the bare `harness approve risk` (no `--scope`) keeps writing
  # only the production tag. See CHANGELOG.md task d03af8f6 for the
  # measured incident this fixed.
  - name: gate-dev-unsafe-deletion
    description: Require approval for a deletion-verb command whose target cannot be statically proven safe, in every environment.
    trigger:
      event: PreToolUse
      match: "Bash"
    when:
      action.deletion_target_unresolvable: true
    requires:
      ledger_tag: "risk-approved:deletion:${SESSION_ID}"
    hook: risk-gate
    enforcement: require_approval
    producers:
      - kind: ask
        command: harness approve risk --scope deletion
        description: Operator approves this Risk Gate decision from their own shell.
      - kind: mcp
        verb: mcp__grounding-mcp__ledger_add
        example: '{sessionId:"${SESSION_ID}", type:"fact", content:"risk-approved:deletion:${SESSION_ID} — operator-authorized", source:"operator"}'
        description: Recovery path if the approve verb is unavailable; only meaningful when the OPERATOR authorizes the content.
    ux:
      cannot: "You cannot run this deletion command yet — its target cannot be statically proven safe."
      required:
        - "operator approval of this Risk Gate decision, OR an absolute target inside a declared risk.safe_deletion_roots entry"
      run:
        - "harness approve risk --scope deletion"
        - "Or point the command at a path under risk.safe_deletion_roots (default: /tmp, /private/tmp) instead of an unresolved variable, relative path, or traversal."

  # deny-kill-switch-bypass / deny-session-env-strip / deny-pause-sentinel-forgery
  # (task cf1fde6d): `harness pause`/`harness resume` refuse to run inside an
  # agent shell in CODE, but that CLI check (refuseIfAgentShell / refuseIfNonTTY
  # in src/cli/pause/index.ts) is a speed bump, not a boundary: a Claude Code
  # `! `-prefixed shell inherits this session's env AND its non-TTY stdin, so
  # it is indistinguishable from an agent Bash call and trips the same checks
  # (verified live; docs/okf/pause-vs-gate-kill-switch.md). This PreToolUse
  # layer is the enforcement point that actually runs BEFORE the agent's Bash
  # executes.
  #
  # UPDATE (task 2cc73f55, closes the gap the HONESTY NOTE below used to
  # document): these three now declare `operator_only: true` instead of a
  # requires.ledger_tag. Every requires:-based policy in this engine is, by
  # construction, satisfiable by the SAME agent it gates: nothing stops it
  # from calling mcp__grounding-mcp__ledger_add with content matching the
  # tag for its own session before running the denied command, which used to
  # flip deny to allow (src/runtime/intercept.ts, the satisfied-requires
  # branch). `operator_only: true` closes that specific hole: the policy
  # declares NO requires: at all, and intercept() short-circuits to an
  # unconditional deny before the requires pipeline runs — no ledger query,
  # no template substitution, so no ledger write, marker file, or flag can
  # ever flip it to allow. See docs/writing-custom-policies.md tripwire 4 and
  # the "Operator-only unconditional deny" section for the schema contract,
  # and tests/cli/init-full-template-kill-switch-deny.test.ts for a test that
  # forges every ledger-evidence shape available to intercept() and asserts
  # the block holds.
  #
  # RESIDUAL GAP (still open, out of scope for task 2cc73f55): bash_match is
  # still a regex over the raw command string, matched BEFORE evaluation ever
  # reaches operator_only:, so it still cannot see through a heredoc,
  # `sh -c '...'`, `eval`, a base64-decoded payload, or a script file the
  # agent writes and then executes — an agent that defeats the TRIGGER match
  # never reaches this deny at all. That is a bash_match coverage gap, not a
  # requires-satisfaction gap, and is unrelated to the fix here (see PR #341
  # for the known uncoverable shapes). `harness validate` no longer warns
  # "declares no producers" on these three (checkPolicySelfAttestation now
  # recognises operator_only: true as correct-by-construction).
  - name: deny-kill-switch-bypass
    description: Deny harness pause, harness resume, harness gate disable, and harness gate enable from the agent's Bash tool. These are operator-only kill switches.
    trigger:
      event: PreToolUse
      match: "Bash"
      bash_match: '(^|\n|;|\||&|\()\s*(\w+=\S*\s+)*(?:npx\s+|\S*/)?harness\s+(["\x27]?)(?:pause|resume|gate\s+(["\x27]?)(?:disable|enable)\4)\3(?![\w-])'
    operator_only: true
    hook: deny-kill-switch-bash
    enforcement: block
    ux:
      cannot: "You cannot run `harness pause`, `harness resume`, `harness gate disable`, or `harness gate enable`."
      required:
        - "the OPERATOR to run this from a terminal genuinely outside your agent session, not a `! `-prefixed Claude Code shell, which inherits this session's env and stdin and does not count"
      run:
        - "Stop. Explain to the operator what you were trying to do and why, and let THEM decide whether to run that command from their own terminal. This is the only way to unblock this gate: it is an unconditional deny (operator_only: true) that no in-session evidence — a ledger write, a marker file, a flag — can ever satisfy; the only remaining gap is bash_match's regex coverage of exotic shell shapes, not this evaluation (see docs/okf/pause-vs-gate-kill-switch.md)."

  - name: deny-session-env-strip
    description: Deny Bash attempts to strip or unset the agent-session env vars that harness pause/resume check ($CLAUDE_CODE_SESSION_ID, $CLAUDE_SESSION_ID, $CODEX_SESSION_ID). Closes the one-liner that otherwise defeats refuseIfAgentShell.
    trigger:
      event: PreToolUse
      match: "Bash"
      bash_match: '(^|\n|;|\||&|\()\s*(\w+=\S*\s+)*(env\b[^;\n|&]*-u\s*(CLAUDE_CODE_SESSION_ID|CLAUDE_SESSION_ID|CODEX_SESSION_ID)\b|env\b[^;\n|&]*--unset(?:=|\s+)(CLAUDE_CODE_SESSION_ID|CLAUDE_SESSION_ID|CODEX_SESSION_ID)\b|unset\s+(\S+\s+)*(CLAUDE_CODE_SESSION_ID|CLAUDE_SESSION_ID|CODEX_SESSION_ID)\b|(CLAUDE_CODE_SESSION_ID|CLAUDE_SESSION_ID|CODEX_SESSION_ID)=(?=\s))'
    operator_only: true
    hook: deny-session-env-strip-bash
    enforcement: block
    ux:
      cannot: "You cannot strip or unset your own agent-session id env vars from Bash."
      required:
        - "no legitimate reason from inside this session: stripping $CLAUDE_CODE_SESSION_ID / $CLAUDE_SESSION_ID / $CODEX_SESSION_ID is recognised as an attempt to defeat the harness pause/resume agent-shell check"
      run:
        - "Stop. If you believe you have a legitimate reason to run a command without one of these env vars set, ask the OPERATOR to do it from their own terminal instead. This gate is an unconditional deny (operator_only: true); see docs/okf/pause-vs-gate-kill-switch.md for the honest trust model and the residual bash_match coverage gap."

  - name: deny-pause-sentinel-forgery
    description: Deny Bash writes (redirect, tee, cp) to the harness pause sentinel file (.harness-paused). The sentinel is unsigned JSON; a forged file silences every gate exactly like a real operator pause. Reads (cat, stat) are unaffected.
    trigger:
      event: PreToolUse
      match: "Bash"
      bash_match: '(^|\n|;|\||&|\()\s*(\w+=\S*\s+)*(tee|cp)\b[^;\n|&]*\.harness-paused\b|>{1,2}\s*\S*\.harness-paused\b'
    operator_only: true
    hook: deny-sentinel-write-bash
    enforcement: block
    ux:
      cannot: "You cannot write to the harness pause sentinel file (.harness-paused)."
      required:
        - "the OPERATOR to run `harness pause`/`harness resume` themselves, from a terminal outside your agent session, never a direct write to the sentinel file"
      run:
        - "Stop. Do not write, redirect, tee, or copy anything to .harness-paused. Ask the OPERATOR to silence the gates themselves, from their own terminal, using the operator-only command named under Required, if the session genuinely needs it. This gate is an unconditional deny (operator_only: true); see docs/okf/pause-vs-gate-kill-switch.md for the honest trust model and the residual bash_match coverage gap."

policy_packs:
  - name: understanding-before-execution
    source: builtin
    enabled: true
    description: Force agents to expose their task interpretation and wait for explicit human approval before any write-capable tool fires.
    config:
      mode: grill_me
      # Producers (agent-tasks/25bced52): rendered into the gate's deny
      # envelope by the same engine as policy producers. Constraint at
      # this layer: at-least-one `ask`. Post-v0.14.0 the gate signal
      # is a filesystem marker and the mcp ledger_add path no longer
      # satisfies the gate; the canonical unblock surface is the
      # operator-approval prompt.
      producers:
        - kind: ask
          command: harness approve understanding
          description: "Bare command, no pipes or chaining. The hook recognises it via isEscapeCommand and emits permissionDecision:ask; the operator's go on that prompt IS the gate approval. Golden path."
        - kind: bash
          command: harness approve understanding
          description: Same command from any un-hooked terminal (operator only, not reachable from inside the gated session). Writes the canonical marker at harness.generated/.approvals/${SESSION_ID}.
      # ux (agent-tasks/e48e3b45): replaces the legacy engine-vocabulary
      # deny envelope with the plain-language { cannot, required, run }
      # shape. Engine details still land in stderr for operator audit;
      # the agent only sees this.
      ux:
        cannot: "You cannot use write-capable tools yet."
        required:
          - "an approved Understanding Report for this session"
        run:
          - "Write an Understanding Report covering: Current Understanding, Intended Outcome, Derived Todos, Acceptance Criteria, Assumptions, Open Questions, Out Of Scope, Risks, Verification Plan, Prior Art (state what you searched for an existing solution and what you found, with an explicit adopt-or-build judgment)"
          - "Run `harness approve understanding` with the report attached as a quoted heredoc (harness approve understanding <<'UNDERSTANDING_REPORT' ...report... UNDERSTANDING_REPORT) so it is persisted for audit, then approve the prompt; the heredoc is the only extra shell shape the gate allows (no pipes, chaining, or other redirection)"
      # approval_lifecycle (agent-tasks/d8ee60ca + harness/f54e0ecb,
      # v0.18.0+): expire the approval marker on task-completion
      # boundaries so a multi-task session re-prompts for an
      # Understanding Report between tasks. Without this the legacy
      # "one approval per session" contract lets a stale interpretation
      # drive the next task's edits.
      #
      # Full ships both boundary kinds: the agent-tasks MCP verbs for
      # operators on that workflow, plus a Bash regex list for hybrid
      # operators who also use gh-cli for PR mechanics. `max_age` is
      # the safety net. Operators who prefer the legacy per-session
      # behaviour opt out with `approval_lifecycle: { mode: session }`.
      # Operators on other task systems override the matchers.
      approval_lifecycle:
        expire_on_tool_match:
          - mcp__agent-tasks__task_finish
          - mcp__agent-tasks__task_abandon
          - mcp__agent-tasks__pull_requests_merge
          # Legacy v1 verb; the hook applies a status filter so only
          # `tool_input.status == "done"` actually expires the marker
          # (open / in_progress / review keep the work claim per v2
          # semantics, see PR #200).
          - mcp__agent-tasks__tasks_transition
        expire_on_bash_match:
          - '^gh pr (merge|close)\b'
          - '^git push origin (master|main)\b'
        max_age: 4h
      # auto_approve (shipped default): a session started with
      # bypassPermissions gets its Understanding Report approved by the
      # hook's signed auto path instead of a human `harness approve
      # understanding` prompt; the report itself stays mandatory.
      # bypassPermissions is the operator's own launch choice
      # (--dangerously-skip-permissions / --permission-mode
      # bypassPermissions). Delete this block to restore the manual prompt.
      auto_approve:
        when: [bypassPermissions]
        harnesses: [claude-code]
        require_report: true

  # branch-protection (agent-tasks/2fdc5bbe, default-enabled since v0.17.2):
  # blocks Write/Edit (claude-code) or apply_patch (codex) on protected
  # branches (default: master, main, develop). Complements
  # preflight-before-push, which fires at the LAST reversible step;
  # branch-protection fires at the FIRST source mutation. Set
  # config.protected_branches to override the default list, or set
  # enabled: false if your workflow routinely edits master directly.
  # Full reference: docs/policy-packs/branch-protection.md.
  - name: branch-protection
    source: builtin
    enabled: true
    description: Block Write/Edit on protected branches (master, main, develop) at the first source mutation.
    config:
      # ux (agent-tasks/9806d4f8): replaces the legacy
      # "branch-protection: refusing ..." envelope with the
      # plain-language { cannot, required, run } shape. Engine details
      # stay on stderr for operator audit.
      ux:
        cannot: "You cannot edit files on protected branch ${BRANCH} yet."
        required:
          - "a checkout of a non-protected branch (current `${BRANCH}` is protected)"
        run:
          - "git checkout -b feat/<your-task>"
          - "harness session-start branch-check"

  # solution-acceptance (harness cc43c7a4): Verifier-gated Done. Gates the
  # task-finishing tools (agent-tasks completion verbs + git push / gh pr
  # merge) on a ready, HEAD-pinned verdict that the grounding-mcp producer
  # (solution_evaluate) derives from a real preflight run, plus an
  # anti-forgery write-guard on the verdict marker. DISABLED by default: it
  # is a hard completion-gate and needs grounding-mcp (>= 0.3.2) under
  # tools.mcp plus the preflight binary on PATH. Flip enabled: true once the
  # producer is wired and you want completion earned, not claimed.
  - name: solution-acceptance
    source: builtin
    enabled: false
    description: Gate task completion on a ready, HEAD-pinned solution-acceptance verdict earned from a real preflight run.

  # post-merge-gate (harness T-001, post-merge-gate): catches "kept working
  # on a branch after it was already merged" — a PostToolUse producer
  # records a merged-tip fact on a successful `gh pr merge`; a PreToolUse
  # blocker denies curated history-mutating commands (git commit/add/push/
  # merge/rebase/cherry-pick/revert/reset/stash pop|apply, gh pr create/
  # merge) while the current branch tip still exactly matches that
  # recorded tip. The recovery vocabulary (git switch/checkout/pull/fetch,
  # git branch -d/-D, git stash list/show, any `harness ...` command)
  # always passes as its OWN command, classified before any manifest or
  # ledger access. Chaining one of those with a curated mutation does NOT
  # exempt the mutation (task 19356be7).
  # Fails OPEN (unlike branch-protection) when the ledger is unreachable.
  # DISABLED by default: a fresh gate, opt in once you've reviewed the
  # curated command list for your workflow. Full reference:
  # docs/policy-packs/post-merge-gate.md.
  - name: post-merge-gate
    source: builtin
    enabled: false
    description: Deny curated history-mutating git/gh commands on a branch whose current tip was already merged.
    config:
      # ux: replaces the legacy "post-merge-gate: refusing ..." envelope
      # with the plain-language { cannot, required, run } shape.
      ux:
        cannot: "You cannot run ${TOOL_NAME} on branch ${BRANCH} yet — its current tip was already merged."
        required:
          - "a branch tip that is not sitting at an already-merged commit (switch off `${BRANCH}`, or move its tip with a new commit)"
        run:
          - "git switch ${DEFAULT_BRANCH}"
          - "git pull --ff-only"
          - "git branch -d ${BRANCH}  # optional cleanup"

# Phase 7 Risk Gate. As of Phase 7 #5/#6 these are LIVE at the runtime
# gate: `harness policy intercept` classifies actions against
# `risk.classifiers[]`, resolves the target environment against
# `environments.resolvers[]`, evaluates each policy's `when:`, and
# enforces the four-way `allow / warn / require_approval / deny`
# decision. The dangerous-shell classifier and production-signals
# resolver below feed the gate-prod-destructive policies. Full design
# and the decision model: docs/risk-gate.md + docs/ROADMAP.md Phase 7.
risk:
  # Safe-deletion-root allowlist for gate-dev-unsafe-deletion's
  # `action.deletion_target_unresolvable` clause (task d03af8f6): an
  # absolute deletion target inside one of these roots is allowed; a
  # relative path, an unexpanded $VAR/~, or a traversal that normalizes
  # outside every root is gated. Shown explicitly even though it matches
  # the schema default (`/tmp`, `/private/tmp` — the two spellings this
  # harness's own scratchpad convention can use, macOS symlinks /tmp to
  # /private/tmp) so an operator sees the live config surface here rather
  # than having to know the schema default exists. An override REPLACES
  # this list, it does not merge with it. See docs/risk-gate.md.
  safe_deletion_roots:
    - /tmp
    - /private/tmp
  classifiers:
    - name: dangerous-shell
      tool: Bash
      patterns:
        # NOTE (task d03af8f6): the alternation `(/|/var|/data|/mnt|~)`
        # below is dead — the bare `/` branch matches every absolute
        # path, so `/var`/`/data`/`/mnt` never independently contribute a
        # match `/` alone would not already produce. Left as-is
        # deliberately rather than "cleaned up": this pattern only feeds
        # the production-scoped gate-prod-destructive* policies above
        # (existing prod-policy semantics, out of this task's scope to
        # touch), and the dead branches are cosmetic — collapsing them to
        # a single `/` changes nothing this classifier matches. The new,
        # environment-independent dev-context gap this dead alternation
        # is adjacent to (an rm -rf against ANY absolute path, in ANY
        # environment) is what gate-dev-unsafe-deletion +
        # `risk.safe_deletion_roots` above actually close.
        - pattern: 'rm\s+-rf\s+(/|/var|/data|/mnt|~)'
          categories: [destructive, data_loss]
          severity: critical
        - pattern: 'DROP\s+TABLE|TRUNCATE\s+TABLE|DELETE\s+FROM'
          categories: [destructive, data_loss]
          severity: high
        # Token-based, flag-tolerant: a flag between `kubectl` and
        # `delete` (e.g. `kubectl --context=x delete namespace payments`)
        # must not defeat the match, without matching `kubectl
        # get`/`describe` and without exponential-backtracking on a long
        # flag run. `(?:\s+-\S+(?:\s+(?!delete\b)(?!-)\S+)?)*` consumes
        # zero or more `-`/`--` flag tokens (each optionally taking one
        # following, non-flag, non-"delete" value token), linear in
        # command length. See docs/risk-gate.md for the full rationale
        # and the earlier quadratic-alternation form this replaced.
        - pattern: 'kubectl(?:\s+-\S+(?:\s+(?!delete\b)(?!-)\S+)?)*\s+delete\s+(namespace|deployment|statefulset|pvc)'
          categories: [destructive, infrastructure_change]
          severity: high
        # Same flag-tolerance treatment for terraform's own `-chdir=DIR`
        # global flag, which sits between the tool name and the
        # subcommand (`terraform -chdir=infra destroy`).
        - pattern: 'terraform(?:\s+-\S+(?:\s+(?!destroy\b)(?!-)\S+)?)*\s+destroy'
          categories: [destructive, infrastructure_change]
          severity: critical
        # Task 2929c5b7: unclassified commands no longer trivially
        # satisfy `risk.severity_at_least: critical` (see when-eval.ts
        # and docs/risk-gate.md's "Unclassified actions and the
        # fail-close rule") — an unrecognized action is still risk-
        # bearing (it satisfies severity_at_least up through `high`),
        # but no longer counts as PROVEN critical on its own. Loosening
        # that fallback would silently reopen a bypass for a
        # mutating/destructive head that simply has no classifier
        # pattern, so every action comparably destructive to the two
        # `critical` patterns above (rm -rf, terraform destroy) or the
        # `high` ones (DROP TABLE, kubectl delete) is now classified
        # explicitly too, at the matching severity, rather than relying
        # on the (now weaker) fallback to catch it. Read-only siblings of
        # these same heads (`sed` without `-i`, `curl` without
        # `-X`/`-d`, `git status`/`log`/`rev-list`/...) are handled by
        # the Risk Classifier's built-in read-only floor
        # (`read-only-bash.ts`), not by a pattern here.
        - pattern: '\bdd\s[^\n]*\bof='
          categories: [destructive, data_loss]
          severity: critical
        - pattern: '\btruncate\b[^\n]*(-s|--size)\b'
          categories: [destructive, data_loss]
          severity: critical
        - pattern: '\bshred\b'
          categories: [destructive, data_loss, irreversible_action]
          severity: critical
        - pattern: '\bmkfs(\.\w+)?\b'
          categories: [destructive, data_loss, infrastructure_change]
          severity: critical
        - pattern: '\bfind\b[^\n]*-delete\b'
          categories: [destructive, data_loss]
          severity: critical
        - pattern: '\bfind\b[^\n]*-exec(dir)?\s+rm\b'
          categories: [destructive, data_loss]
          severity: critical
        - pattern: '\bgit\s+reset\b[^\n]*--hard\b'
          categories: [destructive, data_loss]
          severity: high
        - pattern: '\bgit\s+push\b[^\n]*(--force(-with-lease)?\b|\s-f\b)'
          categories: [destructive, production_mutation, deployment_change]
          severity: high
        - pattern: '\bgit\s+clean\b[^\n]*(--force\b|\s-[a-zA-Z]*f[a-zA-Z]*\b)'
          categories: [destructive, data_loss]
          severity: high
        - pattern: '\bgit\s+checkout\s+--\s+\.'
          categories: [destructive, data_loss]
          severity: high
        - pattern: '\bgit\s+restore\s+\.(\s|$)'
          categories: [destructive, data_loss]
          severity: high
        - pattern: '\b(chmod|chown)\b[^\n]*(-R\b|--recursive\b)'
          categories: [mass_update]
          severity: high
        - pattern: '\bcurl\b[^\n]*(-X\s*(POST|PUT|PATCH|DELETE)\b|--request[\s=](POST|PUT|PATCH|DELETE)\b)'
          categories: [production_mutation, network_exfiltration]
          severity: high
        - pattern: '\bcurl\b[^\n]*(\s-d\b|--data\b|--upload-file\b|\s-T\b)'
          categories: [production_mutation, network_exfiltration]
          severity: high
        - pattern: '\bsed\b[^\n]*(\s-[a-zA-Z]*i[a-zA-Z]*\b|--in-place\b)'
          categories: [destructive, data_loss]
          severity: high

environments:
  resolvers:
    - name: production-signals
      environment: production
      signals:
        branch_patterns: [main, "release/*"]
        env_var_patterns:
          - var: DATABASE_URL
            patterns: [prod, production]
        kube_context_patterns: [".*prod.*"]
        kube_namespace_patterns: [prod, production]

workflows:
  - name: feature-pr
    when:
      task_label: ["feat", "fix", "refactor"]
      project: harness
    steps:
      - kind: branch
        from: master
        per_task: true
      - kind: review_subagent
        spawn: required
        agent_type: Explore
        rigor: rigorous
        template: rigorous
        on_findings: fix_then_remerge
      - kind: ci_gate
        wait_for: completed/success
      - kind: merge
        method: squash
        gate: agent_tasks_label
  - name: docs-pr
    when:
      task_label: ["docs"]
    steps:
      - kind: review_subagent
        spawn: optional
        rigor: docs-only
        template: docs-only
      - kind: merge
        method: squash
        gate: solo

review_templates:
  rigorous: |
    You MUST work through this checklist explicitly. Report findings under
    each heading. Do not skip:
    1. Correctness
    2. Scope / minimality
    3. Tests
    4. CLI surface / UX
    5. Open questions / risks
  quick: |
    Sanity-check this diff for obvious correctness, scope creep, and test
    coverage. Three to five sentences total. Flag anything that surprises
    you.
  docs-only: |
    Read the new prose. Flag em-dashes, hedging openers, factual
    inaccuracies, broken cross-references. Code untouched.

audit:
  redact:
    - regex: "Bearer\\s+[A-Za-z0-9._-]+"
      replacement: "Bearer <REDACTED>"
    - env_var: AGENT_TASKS_TOKEN
    - env_var: OPENAI_API_KEY
