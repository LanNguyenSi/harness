# Reference manifest covering every field in ARCHITECTURE.md Appendix A.
# Used as the schema-parser fixture for parseManifest() acceptance tests.
#
# NOT a runnable config. This file is a schema-coverage example that
# exercises the supported fields. Running
#   harness validate --config docs/examples/full-manifest.yaml
# on an arbitrary machine WILL report binaries that only exist in a real
# install: the required git-batch as an error, others (e.g. ledger) as
# warnings. That is expected:
# validate is doing its job, the manifest is doing its job, the assets
# just only exist on a wired-up host. Run
# `harness init --template full` for a manifest tailored to your machine.
version: 1

grounding:
  session:
    auto_start: true
    id_format: "gs-{repo}-{rand:8}"
  evidence_ledger:
    path: ~/.evidence-ledger/ledger.db

tools:
  mcp:
    - name: codebase-oracle
      command: [npx, tsx, ~/git/pandora/codebase-oracle/src/mcp-server.ts]
      health:
        verb: oracle_list_repos
        timeout_ms: 5000
      enabled: true
    - name: agent-tasks
      command: [node, ~/git/pandora/agent-tasks/mcp-server/dist/server.js]
      env:
        AGENT_TASKS_URL: https://agent-tasks.opentriologue.ai
      health:
        verb: projects_list
        timeout_ms: 5000
      enabled: true
    - name: grounding-mcp
      command: [node, ~/git/pandora/agent-grounding/packages/grounding-mcp/dist/server.js]
      # No env block on purpose: grounding-mcp resolves EVIDENCE_LEDGER_DB via
      # os.homedir(). A literal `~` here is not expanded and scatters a rogue
      # ./~/.evidence-ledger/ledger.db relative to cwd (v0.10.0 template fix).
      health:
        verb: ledger_status
        timeout_ms: 5000
      enabled: true

  cli:
    - name: git-batch
      binary: git-batch
      min_version: "0.2.0"
      required: true
    - name: gh
      binary: gh
      required: true
    - name: ledger
      binary: ledger
      required: false

  skills:
    enabled:
      - simplify
      - init
      - review
      - security-review
    source_dirs:
      - ~/.claude/skills

  builtin:
    known: [Read, Edit, Write, Bash, Agent, Skill, TaskCreate]

memory:
  directories:
    - path: ~/.claude/projects/{project}/memory
      scope: project
  router:
    command: [node, ~/git/pandora/agent-memory/packages/memory-router/dist/hooks/user-prompt-submit.js]
    enabled: true
  retention:
    staleness_days: 180
    broken_refs: warn
  scopes:
    default: project
    allowed: [project, user]

policy_packs:
  # branch-protection (agent-tasks/2fdc5bbe, default-enabled since v0.17.2):
  # blocks Write/Edit (claude-code) or apply_patch (codex) when git names a
  # protected branch (default: master, main, develop) for the directory the
  # call writes into, or cannot answer. Complements the push-time gates,
  # which fire at the LAST reversible step; branch-protection fires at the
  # FIRST source mutation. Set config.protected_branches to override the
  # default list, or set enabled: false if your workflow routinely edits
  # master directly. Full reference: docs/policy-packs/branch-protection.md.
  - name: branch-protection
    source: builtin
    enabled: true
    description: Block Write/Edit on protected branches (master, main, develop) at the first source mutation.
    config:
      # ux (agent-tasks/9806d4f8): replaces the default
      # "branch-protection: refusing ..." text with the plain-language
      # { cannot, required, run } shape. Engine details stay on stderr
      # for operator audit.
      ux:
        cannot: "You cannot edit files on protected branch ${BRANCH} yet."
        required:
          - "a checkout of a non-protected branch (current `${BRANCH}` is protected)"
        run:
          - "git checkout -b feat/<your-task>"

workflows:
  - name: feature-pr
    when:
      task_label: ["feat", "fix", "refactor"]
      project: harness
    steps:
      - kind: branch
        from: master
        per_task: true
      - kind: review_subagent
        spawn: required
        agent_type: Explore
        rigor: rigorous
        template: rigorous
        on_findings: fix_then_remerge
      - kind: ci_gate
        wait_for: completed/success
      - kind: merge
        method: squash
        gate: agent_tasks_label
  - name: docs-pr
    when:
      task_label: ["docs"]
    steps:
      - kind: review_subagent
        spawn: optional
        rigor: docs-only
        template: docs-only
      - kind: merge
        method: squash
        gate: solo

review_templates:
  rigorous: |
    You MUST work through this checklist explicitly. Report findings under
    each heading. Do not skip:
    1. Correctness
    2. Scope / minimality
    3. Tests
    4. CLI surface / UX
    5. Open questions / risks
  quick: |
    Sanity-check this diff for obvious correctness, scope creep, and test
    coverage. Three to five sentences total. Flag anything that surprises
    you.
  docs-only: |
    Read the new prose. Flag em-dashes, hedging openers, factual
    inaccuracies, broken cross-references. Code untouched.

audit:
  redact:
    - regex: "Bearer\\s+[A-Za-z0-9._-]+"
      replacement: "Bearer <REDACTED>"
    - env_var: AGENT_TASKS_TOKEN
    - env_var: OPENAI_API_KEY
