version: 1
grounding:
  session:
    auto_start: true
    id_format: gs-{repo}-{rand:8}
  evidence_ledger:
    path: ~/.evidence-ledger/ledger.db
    retention_days: 90
  policies_source: ~/.claude/harness.d/policies/claim-gate.yaml
tools:
  mcp:
    - name: codebase-oracle
      command:
        - npx
        - tsx
        - ~/git/pandora/codebase-oracle/src/mcp-server.ts
      health:
        verb: oracle_list_repos
        timeout_ms: 5000
      enabled: true
    - name: agent-tasks
      command:
        - node
        - ~/git/pandora/agent-tasks/mcp-server/dist/server.js
      env:
        AGENT_TASKS_URL: https://agent-tasks.opentriologue.ai
      health:
        verb: projects_list
        timeout_ms: 5000
      enabled: true
    - name: grounding-mcp
      command:
        - node
        - ~/git/pandora/agent-grounding/packages/grounding-mcp/dist/server.js
      env:
        EVIDENCE_LEDGER_DB: ~/.evidence-ledger/ledger.db
      health:
        verb: ledger_status
        timeout_ms: 5000
      enabled: true
  cli:
    - name: git-batch
      binary: git-batch
      min_version: 0.2.0
      required: true
    - name: gh
      binary: gh
      required: true
    - name: ledger
      binary: ledger
      required: false
  skills:
    enabled:
      - simplify
      - init
      - review
      - security-review
    source_dirs:
      - ~/.claude/skills
  builtin:
    known:
      - Read
      - Edit
      - Write
      - Bash
      - Agent
      - Skill
      - TaskCreate
memory:
  directories:
    - path: ~/.claude/projects/{project}/memory
      scope: project
  router:
    command:
      - node
      - ~/git/pandora/agent-memory/packages/memory-router/dist/hooks/user-prompt-submit.js
    enabled: true
  retention:
    staleness_days: 180
    broken_refs: warn
  scopes:
    default: project
    allowed:
      - project
      - user
hooks:
  - name: git-preflight
    event: SessionStart
    command: ~/.claude/hooks/git-preflight.sh
    blocking: false
    budget_ms: 30000
    description: Run agent-preflight on session start; record ready + confidence into the ledger as preflight:${REPO}.
  - name: require-review-evidence
    event: PreToolUse
    command: ~/.claude/hooks/require-review-evidence.sh
    match: mcp__agent-tasks__pull_requests_merge
    blocking: hard
    budget_ms: 2000
  - name: require-dogfood-evidence
    event: PreToolUse
    command: ~/.claude/hooks/require-dogfood-evidence.sh
    match: Bash
    blocking: hard
    budget_ms: 2000
  - name: require-preflight-evidence
    event: PreToolUse
    command: ~/.claude/hooks/require-preflight-evidence.sh
    match: Bash
    bash_match: ^git (status|log|diff|branch)
    blocking: hard
    budget_ms: 1000
policies:
  - name: review-before-merge
    description: Block PR merges unless a ledger entry tagged review:<pr-number> exists for this session.
    trigger:
      event: PreToolUse
      match: mcp__agent-tasks__pull_requests_merge
      extract:
        PR_NUMBER: toolArgs.prNumber
    requires:
      ledger_tag: review:${PR_NUMBER}
    hook: require-review-evidence
    enforcement: block
  - name: dogfood-before-release
    description: Block npm publish / git tag v* without a recent dogfood ledger entry.
    trigger:
      event: PreToolUse
      match: Bash
      bash_match: ^(npm publish|git tag v.*)
    requires:
      ledger_tag: dogfood:${SESSION_ID}
      within: 24h
    hook: require-dogfood-evidence
    enforcement: block
  - name: two-reviewers-required
    description: At least two distinct reviewer ledger entries must exist for the PR.
    trigger:
      event: PreToolUse
      match: mcp__agent-tasks__pull_requests_merge
      extract:
        PR_NUMBER: toolArgs.prNumber
    requires:
      ledger_tag: review:${PR_NUMBER}
      count:
        min: 2
    hook: require-review-evidence
    enforcement: warn
  - name: preflight-before-investigation
    description: Block investigative git reads when agent-preflight has not run recently with ready:true for the current repo (founding-incident policy).
    trigger:
      event: PreToolUse
      match: Bash
      bash_match: ^git (status|log|diff|branch)
    requires:
      ledger_tag: preflight:${REPO}
      within: 1h
    hook: require-preflight-evidence
    enforcement: block
workflows:
  - name: feature-pr
    when:
      task_label:
        - feat
        - fix
        - refactor
      project: harness
    steps:
      - kind: branch
        from: master
        per_task: true
      - kind: review_subagent
        spawn: required
        agent_type: Explore
        rigor: rigorous
        template: rigorous
        on_findings: fix_then_remerge
      - kind: ci_gate
        wait_for: completed/success
      - kind: merge
        method: squash
        gate: agent_tasks_label
  - name: docs-pr
    when:
      task_label:
        - docs
    steps:
      - kind: review_subagent
        spawn: optional
        agent_type: Explore
        rigor: docs-only
        template: docs-only
        on_findings: fix_then_remerge
      - kind: merge
        method: squash
        gate: solo
review_templates:
  rigorous: |
    You MUST work through this checklist explicitly. Report findings under
    each heading. Do not skip:
    1. Correctness
    2. Scope / minimality
    3. Tests
    4. CLI surface / UX
    5. Open questions / risks
  quick: |
    Sanity-check this diff for obvious correctness, scope creep, and test
    coverage. Three to five sentences total. Flag anything that surprises
    you.
  docs-only: |
    Read the new prose. Flag em-dashes, hedging openers, factual
    inaccuracies, broken cross-references. Code untouched.
