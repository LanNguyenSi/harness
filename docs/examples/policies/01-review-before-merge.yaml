# Recipe A: review before merge (generic worked example)
#
# Gate the agent-tasks MCP merge call on a `review:${PR_NUMBER}`
# ledger entry. Demonstrates: extract from toolArgs, ${VAR}
# substitution in ledger_tag, ux: agent-facing block.
#
# Author loop:
#   harness validate --config docs/examples/policies/01-review-before-merge.yaml
#   harness dry-run "merge PR 42" \
#     --tool mcp__agent-tasks__pull_requests_merge \
#     --tool-args '{"prNumber":42}' \
#     --config docs/examples/policies/01-review-before-merge.yaml

version: 1

tools:
  mcp:
    - name: grounding-mcp
      command: ["/usr/bin/true"]

hooks:
  - name: require-review-evidence
    event: PreToolUse
    command: harness policy intercept
    match: "mcp__agent-tasks__pull_requests_merge"
    blocking: hard
    budget_ms: 2000

policies:
  - name: review-before-merge
    description: Block PR merge unless a review:${PR_NUMBER} ledger entry exists for this session.
    trigger:
      event: PreToolUse
      match: "mcp__agent-tasks__pull_requests_merge"
      extract:
        PR_NUMBER: "toolArgs.prNumber"
    requires:
      ledger_tag: "review:${PR_NUMBER}"
    hook: require-review-evidence
    enforcement: block
    ux:
      cannot: "You cannot merge PR ${PR_NUMBER} yet."
      required:
        - "a logged review for PR ${PR_NUMBER}"
      run:
        - "have the reviewer (or a review subagent) write review:${PR_NUMBER} via mcp__agent-grounding__ledger_add"
