name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: GitHub Release
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog for this version
        id: changelog
        run: |
          awk '/^## \[${{ steps.version.outputs.version }}\]/{found=1; next} /^## \[/{found=0} found' CHANGELOG.md > release_notes.md
          echo "Release notes extracted for v${{ steps.version.outputs.version }}"

      - name: Fail on empty release notes
        # Guards the awk extraction above (task 3ed3d333): when
        # CHANGELOG.md has no populated `## [<version>]` section for the
        # tag being released, the extraction writes 0 bytes (or only
        # blank lines) and the release would silently ship with an empty
        # body. Abort instead — convert [Unreleased] into the version
        # section before tagging.
        run: |
          if ! grep -q '[^[:space:]]' release_notes.md; then
            echo "::error::release_notes.md is empty — CHANGELOG.md has no populated '## [${{ steps.version.outputs.version }}]' section. Convert [Unreleased] into it before tagging."
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          body_path: release_notes.md
          generate_release_notes: false
