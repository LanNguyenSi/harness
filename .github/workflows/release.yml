name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: GitHub Release
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog for this version
        id: changelog
        run: |
          awk '/^## \[${{ steps.version.outputs.version }}\]/{found=1; next} /^## \[/{found=0} found' CHANGELOG.md > release_notes.md
          echo "Release notes extracted for v${{ steps.version.outputs.version }}"

      - name: Fail on empty release notes
        # Guards the awk extraction above (task 3ed3d333): when
        # CHANGELOG.md has no populated `## [<version>]` section for the
        # tag being released, the extraction writes 0 bytes (or only
        # blank lines) and the release would silently ship with an empty
        # body. Abort instead — convert [Unreleased] into the version
        # section before tagging.
        #
        # VERSION comes in via `env:` rather than being interpolated
        # straight into the run: script (as the pre-existing awk step
        # above still does): an `env:`-bound `${{ }}` becomes a plain
        # environment variable, so its value is shell-data, never
        # spliced into the script's syntax.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! grep -q '[^[:space:]]' release_notes.md; then
            echo "::error::release_notes.md is empty — CHANGELOG.md has no populated '## [$VERSION]' section. Convert [Unreleased] into it before tagging."
            exit 1
          fi

      - name: Release-notes size ceiling
        # Re-measures release_notes.md (extracted above) against the same
        # ceiling as scripts/check-release-notes-size.mjs's CEILING
        # constant (115,000, comfortably under GitHub's release/tag body
        # limit of roughly 125,000 characters); ci.yml's `npm run
        # check:release-notes-size` step already catches this before the
        # tag, against package.json's version - this step is the
        # at-tag-time backstop for the same measurement, against the tag
        # actually being released. This job has no node/npm setup (the
        # `ci` job above runs full CI separately), so it re-measures
        # directly rather than shelling out to the script; move the
        # ceiling in both places together, never one alone.
        #
        # `wc -m` measures release_notes.md itself, which already carries
        # the trailing newline awk's ORS appends after the last matched
        # line, so it needs no "+1" the way the check script's JS
        # `.length` measurement (over the joined section, no trailing
        # newline) does. `wc -m` counts CHARACTERS only under a UTF-8
        # locale; without one it falls back to counting BYTES, so a
        # multi-byte UTF-8 character would be over-counted relative to
        # the check script's JS `.length` (UTF-16 code units per
        # character). `LC_ALL: C.UTF-8` below pins the locale so `wc -m`
        # always counts characters, matching the check script's units.
        #
        # VERSION comes in via `env:`, same rationale as the empty-notes
        # guard above: shell-data only, never spliced into the script's
        # syntax.
        env:
          VERSION: ${{ steps.version.outputs.version }}
          LC_ALL: C.UTF-8
        run: |
          size=$(wc -m < release_notes.md | tr -d ' ')
          ceiling=115000
          if [ "${size}" -gt "${ceiling}" ]; then
            echo "::error::release_notes.md is ${size} characters, above the ${ceiling}-character ceiling (GitHub's release/tag body limit is roughly 125,000 characters). Trim CHANGELOG.md's '## [$VERSION]' section before tagging."
            exit 1
          fi
          echo "release_notes.md is ${size} characters (ceiling ${ceiling})."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: v${{ steps.version.outputs.version }}
          body_path: release_notes.md
          generate_release_notes: false
