name: Publish to npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.10.0). The tag must already exist on the repo."
        required: true
        type: string

permissions:
  contents: read
  id-token: write

# One publish per tag at a time. A running publish is never cancelled: a
# half-finished `npm publish --provenance` can leave a version without its
# attestation, so a second run for the same tag queues behind it instead.
concurrency:
  group: publish-npm-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    # The same full gates release.yml runs on a tag push. For a manual run the
    # CI checks out the tag passed as `tag`, the commit the publish job builds.
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
    permissions:
      contents: read

  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Resolve release tag
        id: tag
        env:
          RESOLVED_TAG: ${{ inputs.tag || github.ref_name }}
        run: echo "name=${RESOLVED_TAG}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify package.json version matches tag
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          tag_version="${TAG#v}"
          pkg_version=$(node -p "require('./package.json').version")
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "::error::Tag version ($tag_version) does not match package.json ($pkg_version)" >&2
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Upgrade npm for trusted publishing
        # npm Trusted Publishing (OIDC) needs npm >= 11.5.1; node 22 bundles
        # npm 10, so upgrade first. Auth comes from the GitHub OIDC token
        # (permissions.id-token: write above) matched against the package's
        # Trusted Publisher entry on npmjs.com (repo LanNguyenSi/harness,
        # workflow publish-npm.yml) — no NPM_TOKEN secret involved.
        run: npm install -g npm@^11.5.1 --no-audit --no-fund

      - name: Publish
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          pkg=$(node -p "require('./package.json').name")

          # Read dist.attestations, retrying while it is empty: the registry can
          # serve the version before its attestation is visible, and a single
          # empty read would report a good version as unattested. Up to 5 reads,
          # waiting 5, 10, 20 and 40 s between them. A read error returns 1 at
          # once; an attestation that is still empty after the last read returns
          # 0 with `attestations` empty, and the caller decides.
          attestations=""
          read_attestations() {
            local spec="$1" try=1 max=5 wait=5
            while true; do
              if ! attestations=$(npm view "${spec}" dist.attestations 2>/dev/null); then
                return 1
              fi
              if [ -n "${attestations}" ] || [ "${try}" -ge "${max}" ]; then
                return 0
              fi
              echo "dist.attestations for ${spec} is empty (read ${try}/${max}); retrying in ${wait}s"
              sleep "${wait}"
              try=$((try + 1))
              wait=$((wait * 2))
            done
          }

          # Idempotency: a re-run (workflow_dispatch, or "Re-run failed jobs")
          # can land on a version a prior attempt already published.
          if npm view "${pkg}@${version}" version > /dev/null 2>&1; then
            # The version is present, but a prior attempt may have landed the
            # tarball without its --provenance attestation, and a re-run cannot
            # add one: apply the same attestation check as the retry loop below
            # (read_attestations waits out registry lag before giving up).
            if ! read_attestations "${pkg}@${version}"; then
              echo "::error::could not read dist.attestations for ${pkg}@${version} (registry error); verify manually with npm view ${pkg}@${version} dist.attestations before deprecating anything." >&2
              exit 1
            fi
            if [ -z "${attestations}" ]; then
              echo "::error::${pkg}@${version} is on the registry without a provenance attestation (dist.attestations is empty); this re-run cannot fix it. Deprecate this version and publish a fixed one; do not treat it as released." >&2
              exit 1
            fi
            echo "::notice::${pkg}@${version} is already on the registry; nothing to publish."
            exit 0
          fi

          # Sigstore Rekor occasionally returns a transient TLOG_CREATE_ENTRY
          # 409 (npm/cli#6892) that fails --provenance even though the tarball
          # is fine. Retry up to 3 times with exponential backoff, and treat
          # "already published" as success only when the version also carries
          # its dist.attestations, in case a failed attempt actually reached
          # the registry (a version without the attestation is an error).
          max=3
          attempt=1
          while true; do
            echo "npm publish attempt ${attempt}/${max}"
            if npm publish --access public --provenance; then
              echo "::notice::Published ${pkg}@${version} on attempt ${attempt}."
              exit 0
            fi
            # A failed --provenance publish can still have landed the tarball;
            # give the registry a moment to settle before checking.
            sleep 5
            if npm view "${pkg}@${version}" version > /dev/null 2>&1; then
              # The tarball exists, but that does not prove the --provenance
              # attestation landed (a partially completed publish). Decided
              # once, fleet-wide: an empty dist.attestations here is an error,
              # not a warning, so a version published without provenance is
              # never announced green.
              if ! read_attestations "${pkg}@${version}"; then
                echo "::error::could not read dist.attestations for ${pkg}@${version} (registry error); verify manually with npm view ${pkg}@${version} dist.attestations before deprecating anything." >&2
                exit 1
              fi
              if [ -z "${attestations}" ]; then
                echo "::error::${pkg}@${version} is on the registry but has no provenance attestation (dist.attestations is empty) after a failed publish. Check the Sigstore/Rekor error in the publish log above, then deprecate this version and publish a fixed one; do not treat it as released." >&2
                exit 1
              fi
              echo "::notice::${pkg}@${version} reached the registry despite a non-zero publish exit; treating as success."
              exit 0
            fi
            if [ "${attempt}" -ge "${max}" ]; then
              echo "::error::npm publish failed after ${max} attempts. If the failure is a Sigstore TLog 409, re-run this workflow (Actions -> Publish to npm -> Run workflow) once the Rekor service recovers. A persistent 403/404 instead likely means the npmjs.com Trusted Publisher entry for this repo/workflow is missing or misconfigured; retrying will not fix that." >&2
              exit 1
            fi
            backoff=$((2 ** attempt * 5))
            echo "publish failed; retrying in ${backoff}s"
            sleep "${backoff}"
            attempt=$((attempt + 1))
          done
