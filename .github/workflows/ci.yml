name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          # Full history + tags: check:changelog-coverage compares
          # `git log <last-tag>..HEAD` against CHANGELOG.md's Unreleased
          # section, so it needs the tag and the commits since it.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          # 22 = active LTS, matching publish-npm.yml; node 20 went EOL
          # 2026-04 and dependency-cruiser 18 (check:boundaries) requires
          # ^22||^24||>=26. package.json engines stays >=20 for consumers;
          # the runtime code carries no node-22-only usage.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Import boundaries
        # dependency-cruiser fitness function for the layering
        # (schema -> policies -> runtime -> policy-packs -> cli); the
        # grandfathered shared-util edges are documented in
        # .dependency-cruiser.cjs. Fails on any NEW reverse import.
        run: npm run check:boundaries

      - name: Duplication scan
        # jscpd clone-count pin (scripts/check-duplication.mjs) — the
        # guard that would have caught the 4th parseConfigUx copy.
        # Fails when src/ grows a clone beyond the pinned baseline.
        run: npm run check:duplication

      - name: No committed .only in tests/
        # scripts/check-no-only.mjs — closes the gap where vitest's own
        # allowOnly=false guard can still exit 0 (a file whose `.only`
        # selection leaves nothing running defeats the hermetic-spawn
        # backstop too; see tests/_helpers/hermetic-spawn-allowlist.ts's
        # "Known gap" comment and task b4845053). AST-based (TypeScript
        # compiler), so it never mistakes a `.only` inside a string,
        # comment, or test name for a real describe/it/test call.
        run: npm run check:no-only

      - name: No committed raw control bytes
        # scripts/check-no-raw-control-bytes.mjs — a raw C0/C1/DEL control
        # byte (typed by hand instead of an escaped backslash-u-0000 form)
        # makes git treat the file as binary and defeats text search
        # against it (task b5e6ccb0, round 2 review; widened from a
        # NUL-only gate to the full control-byte class and to docs/.github/
        # in round 3 after a raw BEL turned up in a test literal and the
        # round-2 fix itself landed a NUL in CHANGELOG.md/ci.yml). Scans
        # src/, tests/, scripts/, docs/, .github/ and the repo root's own
        # *.md/*.yml/*.yaml/*.json/*.ts/*.cjs/*.mjs files as raw bytes, not
        # decoded text, so it cannot itself be fooled by a decoding step.
        # Round 4 review: the scan root comes from the script's own
        # location, never the cwd, and an unreadable or missing scan
        # directory or file exits 2 instead of reporting a clean scan of
        # whatever was left readable.
        run: npm run check:no-raw-control-bytes

      - name: Changelog coverage
        # scripts/check-changelog-coverage.mjs — every release-notable
        # commit since the last tag must be linked from CHANGELOG.md's
        # [Unreleased] section (task id / #PR / GHSA id / SHA cite); the
        # skip convention for test/docs/ci/style/refactor/chore commits is
        # documented in the script header. Fails fast BEFORE Build so a
        # release can't be cut with silently missing notes (the pre-0.42.0
        # failure mode; release.yml additionally hard-stops on empty
        # extracted notes).
        run: npm run check:changelog-coverage

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test:cov

      - name: Integration tests
        # Runs the HARNESS_INTEGRATION_TESTS-gated suite that `npm test`
        # skips (operator-state-isolation: the full suite must stay green
        # even with an operator pause sentinel planted). Keeps that
        # operator-recovery-critical behavior from rotting unverified.
        # ~6s locally; the runner's HOME is ephemeral, and the test
        # snapshots and restores any real sentinel in try/finally anyway.
        timeout-minutes: 10
        run: npm run test:integration

      - name: Understanding-gate schema drift check
        # Fetches @lannguyensi/understanding-gate@latest and compares its
        # parser SECTIONS array against the local mirror in
        # src/cli/pack/understanding-report-schema-hint.ts. Fails on drift
        # so a stale gate block message can't silently ship.
        # Depends on Build (consumes dist/cli/pack/...).
        run: npm run check:ug-schema-drift

      - name: Memory frontmatter contract integrity
        # Local-only verification of the pinned producer corpus. It never
        # fetches a producer revision or resolves a moving upstream version.
        run: npm run check:memory-frontmatter-contract
