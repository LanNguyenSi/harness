name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22 = active LTS, matching publish-npm.yml; node 20 went EOL
          # 2026-04 and dependency-cruiser 18 (check:boundaries) requires
          # ^22||^24||>=26. package.json engines stays >=20 for consumers;
          # the runtime code carries no node-22-only usage.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Import boundaries
        # dependency-cruiser fitness function for the layering
        # (schema -> policies -> runtime -> policy-packs -> cli); the
        # grandfathered shared-util edges are documented in
        # .dependency-cruiser.cjs. Fails on any NEW reverse import.
        run: npm run check:boundaries

      - name: Duplication scan
        # jscpd clone-count pin (scripts/check-duplication.mjs) — the
        # guard that would have caught the 4th parseConfigUx copy.
        # Fails when src/ grows a clone beyond the pinned baseline.
        run: npm run check:duplication

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Integration tests
        # Runs the HARNESS_INTEGRATION_TESTS-gated suite that `npm test`
        # skips (operator-state-isolation: the full suite must stay green
        # even with an operator pause sentinel planted). Keeps that
        # operator-recovery-critical behavior from rotting unverified.
        # ~6s locally; the runner's HOME is ephemeral, and the test
        # snapshots and restores any real sentinel in try/finally anyway.
        timeout-minutes: 10
        run: npm run test:integration

      - name: Understanding-gate schema drift check
        # Fetches @lannguyensi/understanding-gate@latest and compares its
        # parser SECTIONS array against the local mirror in
        # src/cli/pack/understanding-report-schema-hint.ts. Fails on drift
        # so a stale gate block message can't silently ship.
        # Depends on Build (consumes dist/cli/pack/...).
        run: npm run check:ug-schema-drift
