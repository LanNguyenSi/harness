name: Bug report
description: Report a defect in harness
labels: ["bug"]
body:
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - YAML schema / parsing
        - PreToolUse hook
        - grounding / ledger integration
        - tools section
        - memory section
        - policies section
        - CLI
        - other / unsure
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Expected vs. actual behavior.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Minimal YAML + commands that trigger the bug.
      render: bash
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: harness version
      placeholder: "0.x.y"
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "20.x"
