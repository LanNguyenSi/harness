# Phase 7 #6 dogfood manifest — Risk Gate enforcement smoke.
#
# Four policies, each pinned to a distinct `trigger.bash_match` so a
# given smoke command hits exactly one of them (no cross-matching, no
# fail-closed interaction between policies). Together they exercise all
# four Risk Gate decision outcomes end-to-end:
#
#   smoke-deny      enforcement: block            -> deny
#   smoke-warn      enforcement: warn             -> warn
#   smoke-approval  enforcement: require_approval -> require_approval / allow
#   gate-kubectl    enforcement: require_approval -> the canonical
#                   `kubectl delete namespace prod` case, run through the
#                   real dangerous-shell classifier (severity: high).
#
# The smoke pipes synthetic PreToolUse events into `harness policy
# intercept --config <this file>` with DATABASE_URL set to a prod-looking
# value, so production-signals resolves environment=production and the
# `when:` clauses match. run-smoke.sh drives it.
version: 1

tools:
  mcp:
    - name: grounding-mcp
      command: [node, /home/lan/git/pandora/agent-grounding/packages/grounding-mcp/dist/server.js]
      health:
        verb: ledger_status
        timeout_ms: 5000
      enabled: true

hooks:
  - name: risk-gate
    event: PreToolUse
    match: "Bash"
    command: harness policy intercept
    blocking: hard
    budget_ms: 2000

risk:
  classifiers:
    - name: dangerous-shell
      tool: Bash
      patterns:
        - pattern: 'kubectl\s+delete\s+(namespace|deployment|statefulset|pvc)'
          categories: [destructive, infrastructure_change]
          severity: high

environments:
  resolvers:
    - name: production-signals
      environment: production
      signals:
        env_var_patterns:
          - var: DATABASE_URL
            patterns: [prod, production]

policies:
  - name: smoke-deny
    description: Phase 7 #6 dogfood — the deny outcome.
    trigger:
      event: PreToolUse
      match: "Bash"
      bash_match: 'RISKSMOKE_DENY'
    when:
      environment.name: production
    requires:
      ledger_tag: "risk-override:${SESSION_ID}"
    hook: risk-gate
    enforcement: block

  - name: smoke-warn
    description: Phase 7 #6 dogfood — the warn outcome.
    trigger:
      event: PreToolUse
      match: "Bash"
      bash_match: 'RISKSMOKE_WARN'
    when:
      environment.name: production
    requires:
      ledger_tag: "risk-warn-ack:${SESSION_ID}"
    hook: risk-gate
    enforcement: warn

  - name: smoke-approval
    description: Phase 7 #6 dogfood — the require_approval / allow outcomes.
    trigger:
      event: PreToolUse
      match: "Bash"
      bash_match: 'RISKSMOKE_APPROVAL'
    when:
      environment.name: production
    requires:
      ledger_tag: "risk-approved:${SESSION_ID}"
    hook: risk-gate
    enforcement: require_approval

  - name: gate-kubectl
    description: Phase 7 #6 dogfood — the canonical kubectl-delete-namespace case.
    trigger:
      event: PreToolUse
      match: "Bash"
      bash_match: 'kubectl\s+delete'
    when:
      risk.severity_at_least: high
      environment.name: production
    requires:
      ledger_tag: "risk-approved:${SESSION_ID}"
    hook: risk-gate
    enforcement: require_approval
