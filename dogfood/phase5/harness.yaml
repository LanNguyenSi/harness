# Phase 5 #1 dogfood manifest. Smallest manifest that exercises the runtime
# pipeline against a real grounding-mcp + real evidence-ledger sqlite db.
#
# Wires `harness policy intercept` itself as the PreToolUse hook (settings.json
# is regenerated by Phase 3 #4 `harness apply`). The smoke driver below
# (run-smoke.sh) does NOT route through Claude Code: it cats a synthetic but
# protocol-shaped tool-event JSON straight into the same binary that the
# generated settings.json would invoke. That is the killer-test from
# Phase 4 #5/#9 reviewer findings: prove the runtime pipeline survives a real
# grounding-mcp + real sqlite ledger before claiming the integration boundary
# is covered.

version: 1

grounding:
  session:
    auto_start: false
    id_format: "phase5-{rand:8}"
  evidence_ledger:
    path: ~/.evidence-ledger/ledger.db
    retention_days: 90

tools:
  mcp:
    - name: grounding-mcp
      command:
        - node
        - /home/lan/git/pandora/agent-grounding/packages/grounding-mcp/dist/server.js
      health:
        verb: ledger_summary
        timeout_ms: 5000
      enabled: true

  cli:
    - name: git
      binary: git
      required: true

  skills:
    enabled: []
    required: []
    source_dirs: []

  builtin:
    known: [Read, Edit, Write, Bash]

memory:
  directories: []
  retention:
    staleness_days: 180
    broken_refs: warn
  scopes:
    default: project
    allowed: [project]

hooks:
  - name: policy-intercept-pretooluse
    event: PreToolUse
    match: "mcp__agent-tasks__pull_requests_merge"
    command: node /home/lan/git/pandora/harness/dist/cli/main.js policy intercept --config /home/lan/git/pandora/harness/dogfood/phase5/harness.yaml
    blocking: hard
    budget_ms: 10000
    description: "Phase 5 #1 dogfood: run review-before-merge against real grounding-mcp."

policies:
  - name: review-before-merge
    description: Block PR merges unless a ledger entry tagged review:<pr-number> exists for the active session.
    trigger:
      event: PreToolUse
      match: "mcp__agent-tasks__pull_requests_merge"
      extract:
        PR_NUMBER: "toolArgs.prNumber"
    requires:
      ledger_tag: "review:${PR_NUMBER}"
    hook: policy-intercept-pretooluse
    enforcement: block
